[package]
name = "rosrustext_msgs"
version = "0.1.0"
edition = "2021"
description = "Bundled ROS 2 messages for rosrustext"
license = "Apache-2.0"

[dependencies]
# Required by generated code
rosidl_runtime_rs = "0.5" 
serde = { version = "1.0", features = ["derive"], optional = true }
serde-big-array = { version = "0.5", optional = true }

# Note: services_msgs is often empty or not used directly in structs, checking validity...
# If generated code uses 'service_msgs', we might need to bundle it too.
# But usually the generated code only references `crate::msg` or `rosidl_runtime_rs`.
# Let's check imports in copied files if needed.

[features]
default = ["serde"]
serde = ["dep:serde", "dep:serde-big-array", "rosidl_runtime_rs/serde"]
