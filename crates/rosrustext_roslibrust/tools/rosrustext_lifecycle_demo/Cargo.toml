[package]
name = "rosrustext_lifecycle_demo"
version = "0.4.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Carl von Ayres <cvonayres@fuelcellsystems.co.uk>"]
repository = "https://github.com/convyares-FCSL/rosrustext"
homepage = "https://github.com/convyares-FCSL/rosrustext"
description = "Roslibrust lifecycle node demo over rosbridge"
publish = false

[dependencies]
roslibrust = { version = "0.18.0", features = ["rosbridge"] }
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "time"] }
rosrustext_roslibrust = { version = "0.2.1", path = "../..", features = ["roslibrust"] }
rosrustext_lifecycle_proxy = { version = "0.4.0", path = "../rosrustext_lifecycle_proxy" }

[workspace]

[patch.crates-io]
rosrustext_core = { path = "../../../rosrustext_core" }
