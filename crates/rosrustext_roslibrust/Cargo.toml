[package]
name = "rosrustext_roslibrust"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "roslibrust adapter for rosrustext lifecycle semantics"
readme = "README.md"
keywords = ["ros2", "rosbridge", "lifecycle", "robotics"]
categories = ["science::robotics"]

[dependencies]
rosrustext_core = { version = "0.1.0", path = "../rosrustext_core" }
roslibrust = { version = "0.18.0", optional = true, features = ["rosbridge"] }

tokio = { workspace = true, features = ["time", "sync"] }

tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }

[features]
default = []
roslibrust = ["dep:roslibrust"]
