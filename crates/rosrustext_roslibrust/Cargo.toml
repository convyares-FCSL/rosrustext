[package]
name = "rosrustext_roslibrust"
version = "0.2.2"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "roslibrust adapter for rosrustext lifecycle semantics"
readme = "README.md"
keywords = ["ros2", "rosbridge", "lifecycle", "robotics"]
categories = ["science::robotics"]
exclude = ["tools/**"]

[dependencies]
rosrustext_core = { version = "0.4.0" }
rosrustext_msgs = { version = "0.2.1", optional = true, features = ["roslibrust"] }
roslibrust = { version = "0.18.0", optional = true, features = ["rosbridge"] }
anyhow = "1.0"

tokio = { workspace = true, features = ["time", "sync"] }

tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time", "sync"] }

[features]
default = []
roslibrust = ["dep:roslibrust", "dep:rosrustext_msgs"]
