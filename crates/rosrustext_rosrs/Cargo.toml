[package]
name = "rosrustext_rosrs"
version = "0.2.4"
edition = "2021"
license = "Apache-2.0"
authors = ["Carl von Ayres <cvonayres@fuelcellsystems.co.uk>"]
repository = "https://github.com/convyares-FCSL/rosrustext"
homepage = "https://github.com/convyares-FCSL/rosrustext"
description = "rclrs adapter for rosrustext ROS 2 lifecycle + parameters parity"
rust-version = "1.75"
readme = "README.md"

[dependencies]
# Core semantics (transport-agnostic)
rosrustext_core = { path = "../rosrustext_core", version = "0.3.2" }

# ROS2 Rust client library (Jazzy dev_ws proven path/patch setup)
rclrs = "0.6"
# Messages bundled in workspace crate for publishing
rosrustext_msgs = { path = "../rosrustext_msgs", version = "0.1.3" }

# Errors + logging (match style you already use elsewhere)
thiserror = "2.0"
tracing = "0.1"

[features]
default = []
# ros2 enables ROS-facing tooling parity that relies on rclrs vendor interfaces.
ros2 = []
# Gates lifecycle message/service surfaces; no hidden deps.
lifecycle_msgs = []
# Nav2 bond support (requires ros2).
bond = ["ros2"]
# Nav2 tooling parity (requires ros2).
transition_graph = ["ros2"]
# docs.rs-only shim to build without a ROS installation (not for users).
docsrs = ["rclrs/use_ros_shim", "rosrustext_msgs/docsrs"]

[dev-dependencies]
# keep empty for now; slice-1 validation lives in rosrustext_dev_ws

[package.metadata.docs.rs]
no-default-features = true
features = ["docsrs"]
rustdoc-args = ["--cfg", "docsrs"]
rustc-args = ["--cfg", "ros_distro=\"jazzy\""]
