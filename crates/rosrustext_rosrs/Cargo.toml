[package]
name = "rosrustext_rosrs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Carl von Ayres <cvonayres@fuelcellsystems.co.uk>"]
repository = "https://github.com/convyares-FCSL/rosrustext_fcsl"
homepage = "https://github.com/convyares-FCSL/rosrustext_fcsl"
description = "rclrs adapter for rosrustext lifecycle semantics (dev_ws only)"
rust-version = "1.75"
readme = "README.md"

[dependencies]
# Core semantics (transport-agnostic)
rosrustext_core = { path = "../rosrustext_core", version = "0.3.0" }

# ROS2 Rust client library (Jazzy dev_ws proven path/patch setup)
rclrs = "0.6"
# Messages bundled in workspace crate for publishing
rosrustext_msgs = { path = "../rosrustext_msgs", version = "0.1.0" }
rcl_interfaces = { version = "*", optional = true }

# Errors + logging (match style you already use elsewhere)
thiserror = "2.0"
tracing = "0.1"

[features]
default = []
ros2 = ["rcl_interfaces"]
lifecycle_msgs = []
bond = ["ros2"]
transition_graph = ["ros2"]

[dev-dependencies]
# keep empty for now; slice-1 validation lives in rosrustext_dev_ws
